name: Build Android APK v0.3.5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK and APK
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          (
            set -e
            export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            fi
            test -x "$SDKMANAGER" || { echo 'Android sdkmanager not found'; exit 127; }
            echo "Using SDK: $ANDROID_HOME"
            echo "Using sdkmanager: $SDKMANAGER"
            "$SDKMANAGER" --version
            if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/35.0.0/zipalign" ]]; then
              (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses)
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
            fi
            bash build-packages.sh android
          ) 2>&1 | tee apk-build.log
      - name: Upload available packages and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMS-Ride20-Android-v0.3.5
          path: |
            installers/*.apk
            installers/*.txt
            apk-build.log
          if-no-files-found: warn
      - name: Report APK build result
        if: always()
        run: |
          echo 'APK outcome: ${{ steps.apk.outcome }}'
          test '${{ steps.apk.outcome }}' = success
